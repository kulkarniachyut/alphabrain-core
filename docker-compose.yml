
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: alphabrain-api
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - alphabrain

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: alphabrain-worker
    environment:
      - ENV=dev
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - alphabrain
  mlflow:
    image: python:3.11-slim  # Use base Python image
    container_name: alphabrain-mlflow
    ports:
      - "5000:5000"
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}  # ADD
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}  # AD
    env_file:
      - .env
    command: >
      sh -c "
      pip install mlflow==2.9.2 psycopg2-binary boto3 &&
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI}
      --default-artifact-root ${MLFLOW_ARTIFACT_ROOT}
      --host 0.0.0.0
      --port 5000
      "
    restart: unless-stopped
    networks:
      - alphabrain  

networks:
  alphabrain:
    driver: bridge