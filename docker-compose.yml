
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: alphabrain-api
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - alphabrain

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: alphabrain-worker
    environment:
      - ENV=dev
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - alphabrain

networks:
  alphabrain:
    driver: bridge