services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: alphabrain-api
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - alphabrain

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: alphabrain-worker
    environment:
      - ENV=dev
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - alphabrain

  mlflow:
    image: python:3.11-slim
    container_name: alphabrain-mlflow
    ports:
      - "5000:5000"
    environment:
      - AWS_DEFAULT_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    env_file:
      - .env
    command: >
      sh -c "
      pip install mlflow==2.9.2 psycopg2-binary boto3 &&
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI}
      --default-artifact-root ${MLFLOW_ARTIFACT_ROOT}
      --host 0.0.0.0
      --port 5000
      "
    restart: unless-stopped
    networks:
      - alphabrain

  # Step 1: Initialize DB (runs once)
  airflow-init:
    image: apache/airflow:2.7.3-python3.11
    container_name: alphabrain-airflow-init
    env_file:
      - .env
    environment:
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@alphabrain.ai || true
    networks:
      - alphabrain

  # Step 2: Scheduler (depends on init)
  airflow-scheduler:
    image: apache/airflow:2.7.3-python3.11
    container_name: alphabrain-airflow-scheduler
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./requirements-airflow.txt:/requirements.txt
    command: >
      bash -c "pip install -r /requirements.txt && airflow scheduler"
    restart: unless-stopped
    networks:
      - alphabrain
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Step 3: Webserver (depends on scheduler)
  airflow-webserver:
    image: apache/airflow:2.7.3-python3.11
    container_name: alphabrain-airflow-webserver
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - AIRFLOW__WEBSERVER__WORKERS=2
      - AIRFLOW__WEBSERVER__WORKER_CLASS=sync
      - AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT=600
      - AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT=600
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./requirements-airflow.txt:/requirements.txt 
    command: >
      bash -c "pip install -r /requirements.txt && airflow webserver"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 80s
    networks:
      - alphabrain
    depends_on:
      airflow-scheduler:
        condition: service_started

networks:
  alphabrain:
    driver: bridge