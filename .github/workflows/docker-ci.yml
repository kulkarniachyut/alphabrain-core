name: Docker CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docker/**'
      - 'requirements.txt'
      - 'docker-compose.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'docker/**'
      - 'requirements.txt'
      - 'docker-compose.yml'

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1

jobs:
  docker-build:
    name: Build & Test Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: alphabrain-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          load: true
          tags: alphabrain-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test API container
        run: |
          docker run -d --name api-test -p 8000:8000 alphabrain-api:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/health || exit 1
          docker stop api-test

      - name: Test Worker container
        run: |
          docker run -d --name worker-test alphabrain-worker:${{ github.sha }}
          sleep 10
          docker ps -a | grep worker-test  # Check container status
          echo "=== Container status ==="
          docker ps -a | grep worker-test || exit 1
          echo "=== Container inspect ==="
          docker inspect worker-test --format='{{.State.Status}} - {{.State.ExitCode}}' || exit 1
          echo "=== Container logs ==="
          docker logs worker-test
          echo "=== Checking for 'Worker started' ==="
          docker logs worker-test | grep -q "Worker started" || exit 1
          docker stop worker-test

      - name: Comment PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Docker Build 🐋
            - ✅ API image built successfully
            - ✅ Worker image built successfully
            - ✅ Health checks passed
            
            **Images:**
            - \`alphabrain-api:${{ github.sha }}\`
            - \`alphabrain-worker:${{ github.sha }}\`
            
            *Pushed by: @${{ github.actor }}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })